name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Validate composer.json
        run: composer validate --strict

      - name: Security audit
        run: composer audit --no-interaction

      - name: Lint YAML config
        run: php bin/console lint:yaml config

      - name: Lint Twig templates
        run: php bin/console lint:twig templates

      - name: Lint container
        run: php bin/console lint:container

      - name: PHP-CS-Fixer
        run: php vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: PHPStan
        run: php vendor/bin/phpstan analyse --no-progress

      - name: PHPUnit
        run: php vendor/bin/phpunit --coverage-clover=var/coverage.xml

      - name: Validate Doctrine schema
        run: php bin/console doctrine:schema:validate --skip-sync

      - name: Run migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Load fixtures
        run: php bin/console doctrine:fixtures:load --no-interaction

      - name: Infection mutation testing
        run: php vendor/bin/infection --threads=4 --show-mutations --no-progress

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: var/coverage.xml
          retention-days: 7
